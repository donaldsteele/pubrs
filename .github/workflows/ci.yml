name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; macos-15-intel replaces the retired
        # macos-13 Intel image (docs/adr/0002-macos-intel-runner.md).
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libegl1 mesa-vulkan-drivers libfontconfig1-dev \
            libdbus-1-dev xvfb
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: core builds without default features
        run: cargo build -p pubrs-core --no-default-features
      - name: tests (unit, goldens, PDF, MCP integration)
        run: cargo test --workspace
      - name: Performance table (Linux, 16 pages, informational)
        if: runner.os == 'Linux'
        run: cargo run --release -p pubrs-cli -- perf --pages 16 --runs 3
      - name: Golden images byte-identical on this OS?
        shell: bash
        run: |
          cargo test -p pubrs-io --test render_golden -- --nocapture --test-threads=1 2>&1 | grep -o 'golden [a-z_]*: .*'
      - name: GPU renderer test (skips without an adapter)
        run: cargo test -p pubrs-render --features gpu --test gpu -- --nocapture
      - name: GUI smoke launch (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run -p pubrs-app -- --smoke-test
      - name: GUI smoke launch (Windows, macOS)
        if: runner.os != 'Linux'
        run: cargo run -p pubrs-app -- --smoke-test
      - name: GUI end-to-end self-test (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" cargo run -p pubrs-app -- --self-test target/gui-selftest
      - name: GUI end-to-end self-test (Windows, macOS)
        if: runner.os != 'Linux'
        run: cargo run -p pubrs-app -- --self-test target/gui-selftest
      - name: pubrs-app.exe opens no console window (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/check-subsystem.ps1 -Gui target\debug\pubrs-app.exe
      - name: GUI self-test through the Mesa llvmpipe restart (Windows; the runner has no GPU)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Same layout as the MSI: pubrs-app.exe, and a copy next to Mesa in mesa\.
          $dir = "$env:RUNNER_TEMP\pubrs-mesa-test"
          ./packaging/windows/fetch-mesa.ps1 -Dest "$dir\mesa"
          Copy-Item target\debug\pubrs-app.exe $dir
          Copy-Item target\debug\pubrs-app.exe "$dir\mesa"
          $p = Start-Process "$dir\pubrs-app.exe" -ArgumentList '--self-test', "$PWD\target\gui-selftest-mesa" -Wait -PassThru -RedirectStandardOutput mesa-selftest.out -RedirectStandardError mesa-selftest.log
          Get-Content mesa-selftest.out
          Get-Content mesa-selftest.log | Select-String 'window drawing|Mesa|WARN|ERROR' | ForEach-Object { $_.Line -replace '\x1b\[[0-9;]*m', '' }
          if ($p.ExitCode -ne 0) { throw "self-test through Mesa failed" }
          if (!(Select-String -Path mesa-selftest.log -Pattern 'window drawing.*llvmpipe' -Quiet)) { throw "did not draw with Mesa llvmpipe" }
      - name: Upload GUI self-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-selftest-${{ matrix.os }}
          path: |
            target/gui-selftest/*.png
            target/gui-selftest-mesa/*.png
          if-no-files-found: ignore
      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-${{ matrix.os }}
          path: target/golden-diffs/
          if-no-files-found: ignore
