[package]
name = "pubrs-api"
description = "Session façade for pubrs: the single entry point for GUI, CLI and MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# GPU page rendering for interactive clients (vello, falls back to tiny-skia).
gpu = ["pubrs-render/gpu"]

[dependencies]
pubrs-core.workspace = true
pubrs-layout.workspace = true
pubrs-render.workspace = true
pubrs-io.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
base64.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
lopdf.workspace = true
