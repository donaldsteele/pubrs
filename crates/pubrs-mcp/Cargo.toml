[package]
name = "pubrs-mcp"
description = "MCP server for pubrs over stdio and streamable HTTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pubrs-api.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio.workspace = true
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
lopdf.workspace = true
