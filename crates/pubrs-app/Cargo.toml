[package]
name = "pubrs-app"
description = "pubrs desktop publishing GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "pubrs-app"
path = "src/main.rs"

[dependencies]
pubrs-api = { workspace = true, features = ["gpu"] }
eframe = { workspace = true, features = ["wgpu", "glow", "default_fonts", "wayland", "x11", "accesskit"] }
rfd.workspace = true
dirs.workspace = true
arboard.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
    "Data_Pdf",
    "Foundation",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSPrintOperation", "NSPrintInfo"] }
objc2-foundation = { workspace = true, features = ["NSString", "NSURL"] }
objc2-pdf-kit = { workspace = true, features = ["PDFDocument", "objc2-app-kit"] }
muda = "0.21"

[package.metadata.deb]
name = "pubrs"
maintainer = "pubrs project <pubrs@users.noreply.github.com>"
copyright = "2026, pubrs contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Desktop publishing for flyers, brochures, business cards and newsletters. \
Includes the pubrs-app GUI, the pubrs command-line tool and the pubrs-mcp \
server for AI assistants."""
section = "graphics"
priority = "optional"
revision = ""
# winit and wgpu/glow load these with dlopen, so `$auto` cannot see them.
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libgl1 | libvulkan1"
recommends = "libwayland-client0, libx11-6, libxcursor1, libxi6, libxrandr2, mesa-vulkan-drivers, cups-client"
assets = [
    ["target/release/pubrs-app", "usr/bin/", "755"],
    ["target/release/pubrs", "usr/bin/", "755"],
    ["target/release/pubrs-mcp", "usr/bin/", "755"],
    ["../../packaging/linux/pubrs.desktop", "usr/share/applications/pubrs.desktop", "644"],
    ["../../packaging/linux/pubrs-mime.xml", "usr/share/mime/packages/pubrs.xml", "644"],
    ["../../packaging/icons/pubrs-16.png", "usr/share/icons/hicolor/16x16/apps/pubrs.png", "644"],
    ["../../packaging/icons/pubrs-32.png", "usr/share/icons/hicolor/32x32/apps/pubrs.png", "644"],
    ["../../packaging/icons/pubrs-48.png", "usr/share/icons/hicolor/48x48/apps/pubrs.png", "644"],
    ["../../packaging/icons/pubrs-64.png", "usr/share/icons/hicolor/64x64/apps/pubrs.png", "644"],
    ["../../packaging/icons/pubrs-128.png", "usr/share/icons/hicolor/128x128/apps/pubrs.png", "644"],
    ["../../packaging/icons/pubrs-256.png", "usr/share/icons/hicolor/256x256/apps/pubrs.png", "644"],
    ["../../packaging/icons/pubrs-512.png", "usr/share/icons/hicolor/512x512/apps/pubrs.png", "644"],
    ["../../packaging/icons/pubrs-document-48.png", "usr/share/icons/hicolor/48x48/mimetypes/application-vnd.pubrs+zip.png", "644"],
    ["../../packaging/icons/pubrs-document-128.png", "usr/share/icons/hicolor/128x128/mimetypes/application-vnd.pubrs+zip.png", "644"],
    ["../../packaging/icons/pubrs-document-256.png", "usr/share/icons/hicolor/256x256/mimetypes/application-vnd.pubrs+zip.png", "644"],
    ["../../examples/samples/bakery-trifold.pubrs", "usr/share/doc/pubrs/examples/", "644"],
    ["../../USER_GUIDE.md", "usr/share/doc/pubrs/", "644"],
]

[package.metadata.bundle]
name = "pubrs"
identifier = "io.github.donaldsteele.pubrs"
icon = ["../../packaging/icons/pubrs-512.png", "../../packaging/icons/pubrs-256.png", "../../packaging/icons/pubrs-128.png", "../../packaging/icons/pubrs-32.png", "../../packaging/icons/pubrs-16.png"]
version = "0.1.0"
copyright = "Copyright (c) 2026 pubrs contributors"
category = "public.app-category.graphics-design"
short_description = "Desktop publishing"
long_description = "Create flyers, brochures, business cards and newsletters."

[package.metadata.bundle.osx]
minimum_system_version = "12.0"
