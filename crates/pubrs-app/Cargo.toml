[package]
name = "pubrs-app"
description = "pubrs desktop publishing GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "pubrs-app"
path = "src/main.rs"

[dependencies]
pubrs-api = { workspace = true, features = ["gpu"] }
eframe = { workspace = true, features = ["wgpu", "glow", "default_fonts", "wayland", "x11", "accesskit"] }
rfd.workspace = true
dirs.workspace = true
arboard.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
    "Data_Pdf",
    "Foundation",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSPrintOperation", "NSPrintInfo"] }
objc2-foundation = { workspace = true, features = ["NSString", "NSURL"] }
objc2-pdf-kit = { workspace = true, features = ["PDFDocument", "objc2-app-kit"] }
muda = "0.21"
